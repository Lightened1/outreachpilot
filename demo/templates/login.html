{% extends "base.html" %}{% block title %}Sign in · Demo Prospect Portal{% endblock %}
{% block content %}
<div class="card" style="max-width:420px">
  <h1>Sign in</h1>
  <p class="muted">Demo credentials are set by DEMO_USERNAME / DEMO_PASSWORD.</p>
  {% if error %}<p class="error" data-testid="login-error">{{ error }}</p>{% endif %}
  <form method="post" action="/login" data-testid="login-form">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" data-testid="login-username" autocomplete="username">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" data-testid="login-password" autocomplete="current-password">
    <button type="submit" data-testid="login-submit">Sign in</button>
  </form>
</div>
{% endblock %}
