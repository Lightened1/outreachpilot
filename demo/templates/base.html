<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Demo Prospect Portal{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --ink:#1d2433; --muted:#5b6475; --line:#dfe3ea; --accent:#2f5bd3; --bg:#f6f7f9; }
    * { box-sizing: border-box; }
    body { margin:0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
    header { background:#fff; border-bottom:1px solid var(--line); padding:12px 28px; display:flex; gap:18px; align-items:center; }
    header .brand { font-weight:700; }
    header .tag { font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:10px; padding:1px 8px; }
    header nav { margin-left:auto; display:flex; gap:14px; }
    main { max-width:860px; margin:28px auto; padding:0 20px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:22px 26px; margin-bottom:18px; }
    h1 { font-size:24px; margin:0 0 4px; } h2 { font-size:16px; margin:18px 0 6px; }
    .muted { color:var(--muted); }
    a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); }
    label { display:block; font-weight:600; margin:12px 0 4px; }
    input[type=text], input[type=password], textarea { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:6px; font:inherit; }
    textarea { min-height:180px; }
    button { margin-top:16px; background:var(--accent); color:#fff; border:0; border-radius:6px; padding:9px 18px; font:inherit; cursor:pointer; }
    .error { color:#b42318; background:#fef3f2; border:1px solid #fecdca; padding:8px 12px; border-radius:6px; }
    .note { background:#fff8db; border:1px solid #f1d98a; border-radius:6px; padding:10px 12px; margin:10px 0 4px; }
    .ok { color:#05603a; background:#ecfdf3; border:1px solid #abefc6; padding:8px 12px; border-radius:6px; }
    ul { margin:4px 0; padding-left:20px; }
    .chips span { display:inline-block; background:#eef2ff; border-radius:12px; padding:2px 10px; margin:2px 4px 2px 0; font-size:13px; }
  </style>
</head>
<body>
  <header>
    <span class="brand">Demo Prospect Portal</span><span class="tag">local test environment &middot; fictional data</span>
    <nav><a href="/people">People</a><a href="/logout">Log out</a></nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
